}

// ============================================================
// WORKOUT SCREEN
// ============================================================
function renderWorkout() {
  const workout   = currentWorkout();
  const exercises = orderedExercises();          // session-local display order
  const total     = activeWorkoutExercises().length; // excludes skipped
  const done      = completedExercises();
  const partial   = partialExercises();

  const items = exercises.map((ex, idx) => {
    const history    = getExerciseHistory(ex.name);
    const recent     = history[0];
    const isDone     = done.includes(ex.name);
    const partialEx  = partial.find(p => p.name === ex.name);
    const isPartial  = !!partialEx && !isDone;
    const skipped    = isSkipped(ex.name);

    let recentHTML = '';
    if (recent && !isDone) {
      const lastWeight  = recent.sets[0]?.weight;
      const lastReps    = recent.sets.map(s => s.reps).join('-');
      const prev        = history[1];
      const prevWeight  = prev?.sets[0]?.weight ?? null;
      const prevMaxReps = prev ? Math.max(...prev.sets.map(s => s.reps)) : null;
      const lastMaxReps = Math.max(...recent.sets.map(s => s.reps));

      let trendIcon = '='; let trendColor = 'var(--text-dim)';
      if (prevWeight !== null) {
        if (lastWeight > prevWeight) { trendIcon = '↑'; trendColor = 'var(--green)'; }
        else if (lastWeight < prevWeight) { trendIcon = '↓'; trendColor = 'var(--red)'; }
        else if (lastMaxReps > prevMaxReps) { trendIcon = '↑'; trendColor = 'var(--green)'; }
        else if (lastMaxReps < prevMaxReps) { trendIcon = '↓'; trendColor = 'var(--red)'; }
      }

      recentHTML = `
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
          <span class="label">Last</span>
          <span style="font-size:0.75rem;font-weight:700;color:var(--text-mid)">${lastReps} @ ${lastWeight}kg</span>
          ${prevWeight !== null ? `<span style="font-size:0.75rem;font-weight:800;color:${trendColor}">${trendIcon}</span>` : ''}
        </div>`;
    }

    // Status badge
    let statusBadge = '';
    if (skipped) {
      statusBadge = `<span style="font-size:0.65rem;font-weight:700;color:var(--text-dim);background:var(--bg-deep);border:1px solid var(--border-mid);border-radius:9999px;padding:2px 7px;letter-spacing:0.04em">SKIPPED</span>`;
    } else if (isDone) {
      statusBadge = `<span class="check-circle">${icons.checkFill}</span>`;
    } else if (isPartial) {
      statusBadge = `<span style="font-size:0.65rem;font-weight:700;color:var(--cyan);background:var(--cyan-glow);border:1px solid var(--cyan-dim);border-radius:9999px;padding:2px 7px">${partialEx.sets}/${partialEx.target}</span>`;
    }

    return `
      <div class="exercise-row-wrap" data-idx="${idx}">
        <button type="button" class="exercise-item ${isDone ? 'done' : isPartial ? 'partial' : ''} ${skipped ? 'skipped' : ''}" onclick="selectExercise(${idx})">
          <div style="flex:1">
            <div class="flex-row mb-1" style="align-items:center;gap:8px">
              <div style="font-size:0.875rem;font-weight:700;${isDone ? 'text-decoration:line-through;color:var(--muted)' : 'color:var(--white)'}">${esc(ex.name)}</div>
              ${statusBadge}
            </div>
            <div class="label">${ex.weight > 0 ? ex.weight + 'kg' : 'BW'} · ${esc(ex.targetReps)} reps</div>
            ${recentHTML}
          </div>
          ${icons.chevron}
        </button>
        <div class="exercise-row-controls">
          <button type="button" class="icon-btn btn-move-up" aria-label="Move up" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''} onclick="moveSessionExercise(${idx}, -1)">${icons.up}</button>
          <button type="button" class="icon-btn btn-move-down" aria-label="Move down" ${idx === exercises.length - 1 ? 'disabled style="opacity:0.3"' : ''} onclick="moveSessionExercise(${idx}, 1)">${icons.down}</button>
          <button type="button" class="btn-skip-toggle ${skipped ? 'active' : ''}" aria-label="${skipped ? 'Include this exercise' : 'Skip this exercise'}" onclick="toggleSkipExercise(${idx})">${skipped ? 'INCLUDE' : 'SKIP'}</button>
        </div>
      </div>`;
  }).join('');

  // Sets logged against exercises since removed from this workout. Shown so
  // the user can see they will still be saved, rather than silently vanishing.
  const orphans     = orphanedExercises();
  const orphansHTML = orphans.length === 0 ? '' : `
    <div class="section-label mt-4"><span>Also logged</span></div>
    <div class="space-y-2">
      ${orphans.map(o => `
        <div class="card--inner">
          <div style="font-size:0.8rem;font-weight:700;color:var(--text-mid)">${esc(o.name)}</div>
          <div class="label mt-1">${o.sets} set${o.sets > 1 ? 's' : ''} · no longer in this workout</div>
        </div>`).join('')}
    </div>`;

  const started    = done.length + partial.length + orphans.length;
  const bottomHTML = started > 0 ? `
    <div class="mt-4 space-y-2">
      <button type="button" class="btn-primary" onclick="completeSession()">
        ${icons.check} COMPLETE SESSION (${done.length}/${total})
      </button>
      <button type="button" class="btn-secondary" onclick="abandonSession()">Abandon Session</button>
    </div>` : '';

  return `
    <div class="screen">
      <div class="container">
        <button type="button" class="btn-back" onclick="goBack()">${icons.back} Back</button>
        ${progressBarHTML(done.length, total, workout?.name ?? '')}
        <div class="space-y-2">${items}</div>
        ${orphansHTML}
        ${bottomHTML}
      </div>
    </div>`;
}

// ============================================================
// EXERCISE SCREEN
// ============================================================
function renderExercise() {
  const ex          = state.activeExercise;
  const workout     = currentWorkout();
  const history     = getExerciseHistory(ex.name);
  const lastSession = history[0] || null;
  const done        = completedExercises();
  const total       = workout?.exercises.length ?? 0;
  const target      = targetSetsFor(ex);
  const progression = state.sets.length >= target ? getProgressionStatus(ex, state.sets) : null;

  // Last session
  const lastHTML = lastSession ? `
    <div class="card--deep mb-3">
      <div class="label mb-1">Last session</div>
      <div style="font-size:0.875rem;color:var(--text-mid);font-weight:600">${lastSession.sets.map(s => s.reps).join('-')} @ ${lastSession.sets[0]?.weight ?? '?'}kg</div>
    </div>` : '';

  // Weight modified warning — always emitted (hidden when not applicable) so
  // syncModifiedLabel() can patch it without a re-render.
  const modRef  = lastSession?.sets?.[0]?.weight;
  const modShow = modRef !== undefined && state.weight !== modRef;
  const modifiedHTML = `<div id="modifiedLabel" class="modified-label"${modShow ? '' : ' style="display:none"'}>${
    modShow ? `↕ Modified from last session (${modRef}kg)` : ''}</div>`;

  // Sets list — any row can be tapped into an inline edit state (tracked in
  // state.editingSetIdx). The edit row's inputs are UNCONTROLLED (see
  // confirmEditSet): nothing re-renders while the user is mid-edit, so they
  // never fight a keystroke-triggered render the way a setState-on-input
  // field would.
  const setsHTML = state.sets.length === 0
    ? `<p style="text-align:center;padding:14px 0;font-size:0.75rem;color:var(--muted)">No sets logged yet</p>`
    : state.sets.map((set, idx) => {
        if (state.editingSetIdx === idx) {
          return `
            <div class="set-row-wrap">
              <div class="set-row set-row-editing">
                <span class="label">Set ${idx + 1}</span>
                <div class="set-edit-fields">
                  <input type="number" inputmode="decimal" step="0.5" min="0" id="editSetWeight"
                         class="input-field set-edit-input" value="${set.weight}" aria-label="Edit weight for set ${idx + 1}" />
                  <span class="set-edit-x">×</span>
                  <input type="number" inputmode="numeric" step="1" min="1" id="editSetReps"
                         class="input-field set-edit-input" value="${set.reps}" aria-label="Edit reps for set ${idx + 1}" />
                </div>
                <div class="set-edit-actions">
                  <button type="button" class="icon-btn" aria-label="Confirm changes to set ${idx + 1}" onclick="confirmEditSet(${idx})">${icons.check}</button>
                  <button type="button" class="icon-btn danger" aria-label="Delete set ${idx + 1}" onclick="deleteSet(${idx})">${icons.x14}</button>
                  <button type="button" class="icon-btn" aria-label="Cancel editing set ${idx + 1}" onclick="setState({editingSetIdx:null})">${icons.x}</button>
                </div>
              </div>
            </div>`;
        }
        return `
        <div class="set-row-wrap">
          <button type="button" class="set-row set-row-tap" onclick="setState({editingSetIdx:${idx}})" aria-label="Edit set ${idx + 1}">
            <span class="label">Set ${idx + 1}</span>
            <span style="display:flex;align-items:center;gap:6px">
              <span style="font-weight:700;font-size:0.9rem">${set.weight}kg × ${set.reps}</span>
              <span class="set-edit-hint">${icons.pencil}</span>
            </span>
          </button>
          ${set.prs?.length > 0 ? `<div class="pr-badges">${set.prs.map(p => `<div class="pr-badge">${p.icon} ${p.message}</div>`).join('')}</div>` : ''}
        </div>`;
      }).join('');

  const removeHTML = state.sets.length > 0 ? `
    <button type="button" class="btn-danger mb-3" onclick="removeLastSet()">${icons.x} Remove last set</button>` : '';

  const progHTML = progression ? `
    <div class="progression ${progression.status}">${progression.message}</div>` : '';

  const placeholder = (lastSession && lastSession.sets.length > 0 && state.sets.length === 0) ? lastSession.sets[0].reps.toString() : '0';

  // Reps input — shown only while more sets are needed; once the target is
  // met the COMPLETE EXERCISE button below takes over instead.
  const repsHTML = state.sets.length < target ? `
    <div class="mb-3">
      <div class="label mb-2">Reps — Set ${state.sets.length + 1}</div>
      <input type="number" inputmode="numeric" step="1" min="1" id="repsInput" value="${state.repInput}"
             placeholder="${esc(placeholder)}" class="input-weight" aria-label="Reps for this set"
             oninput="onRepsInput(this)" onblur="onRepsBlur(this)" />
    </div>` : '';

  // NOTE: the log button is a DIRECT child of .container (no wrapping div) —
  // position:sticky only has room to stick within its own containing block,
  // so wrapping it in a short div (just tall enough for the button itself)
  // would give it nowhere to travel and it would never visibly "stick".
  // .container spans the full exercise screen, giving it real room to work.
  let actionHTML = '';
  if (state.sets.length < target) {
    const saveBackBtn = state.sets.length > 0 ? `
      <button type="button" class="btn-save-back mt-2" onclick="completeExercise()">
        ${icons.check} Save ${state.sets.length} set${state.sets.length > 1 ? 's' : ''} & back
      </button>` : '';
    actionHTML = `
      <button type="button" id="btnLogSet" class="btn-log mb-2" onclick="addSet()" ${!state.repInput || Number(state.repInput) <= 0 ? 'disabled' : ''}>
        ${icons.plus} LOG SET ${state.sets.length + 1}
      </button>
      ${saveBackBtn}`;
  } else {
    actionHTML = `
      <button type="button" class="btn-complete-ex mb-3" onclick="completeExercise()">
        ${icons.check24} COMPLETE EXERCISE
      </button>`;
  }

  const notesHTML = ex.notes ? `<div class="note-box mb-3">💡 ${esc(ex.notes)}</div>` : '';

  const historyHTML = history.length > 1 ? `
    <div class="section-label"><span>Previous sessions</span></div>
    <div class="space-y-2">
      ${history.slice(1).map(entry => `
        <div class="card--inner">
          <div class="label mb-1">${new Date(entry.date).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</div>
          <div style="font-size:0.8rem;color:var(--text-mid);font-weight:600">${entry.sets.map(s => s.reps).join('-')} @ ${entry.sets[0]?.weight ?? '?'}kg</div>
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="screen">
      <div class="container">
        <button type="button" class="btn-back" onclick="goBack()">${icons.back} Back</button>
        ${progressBarHTML(done.length, total, workout?.name ?? '')}

        <div class="card card--glow mb-3">
          <div class="ex-header">
            <div class="ex-accent-bar wk-accent" style="${wkStyle(workout?.color ?? 0)}"></div>
            <div style="flex:1">
              <div class="label mb-1">${esc(workout?.name ?? '')}</div>
              <h2 class="title-lg mb-3">${esc(ex.name)}</h2>
              ${lastHTML}

              <div class="mb-3">
                <div class="label mb-2">Weight (kg)</div>
                <input type="number" inputmode="decimal" step="0.5" min="0" id="weightInput"
                       value="${state.weight}" class="input-weight" aria-label="Weight in kilograms"
                       oninput="onWeightInput(this)" onchange="onWeightInput(this)" onblur="onWeightBlur(this)" />
                ${modifiedHTML}
              </div>

              ${repsHTML}
            </div>
          </div>
        </div>

        <div class="card card--glow mb-3">
          <div class="title-sm mb-3">Sets ${state.sets.length}/${target}</div>
          ${state.sets.length > 0 ? `<div class="space-y-2 mb-3">${setsHTML}</div>` : setsHTML}
          ${removeHTML}
          ${progHTML}
        </div>

        ${actionHTML}

        <div class="grid-2 mb-2 mt-3">
          <div class="card--deep"><span class="label">Target </span><span style="font-weight:600">${esc(ex.targetReps)} reps</span></div>
          <div class="card--deep"><span class="label">Rest </span><span style="font-weight:600">${esc(ex.rest)}</span></div>
        </div>
        ${notesHTML}

        ${historyHTML}
      </div>
    </div>`;
}

// ============================================================
// HISTORY SCREEN
// ============================================================
function renderHistory() {
  // Build exercise list from history for dropdown
  const allExercises = [...new Set(state.history.map(e => e.exercise))].sort();
  const filter = state.historyFilter;

  const dropdown = `
    <div class="mb-4">
      <select aria-label="Filter history by exercise" onchange="setState({historyFilter:this.value})">
        <option value="" ${!filter ? 'selected' : ''}>All exercises</option>
        ${allExercises.map(ex => `<option value="${esc(ex)}" ${filter === ex ? 'selected' : ''}>${esc(ex)}</option>`).join('')}
      </select>
    </div>`;

  // Filter and group
  const filtered = filter ? state.history.filter(e => e.exercise === filter) : state.history;
  const grouped  = filtered.reduce((acc, entry) => {
    const date = new Date(entry.date).toLocaleDateString();
    (acc[date] ??= []).push(entry);
    return acc;
  }, {});

  const bodyHTML = Object.keys(grouped).length === 0
    ? `<div class="card text-center" style="padding:32px"><p style="color:var(--muted);font-size:0.875rem">${filter ? 'No entries for this exercise' : 'No history yet'}</p></div>`
    : `<div class="space-y-3">${Object.entries(grouped).map(([date, entries]) => {
        const d = new Date(entries[0].date);
        const isoVal = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        const isEditing = state.editingDate === date;
        const dateHeader = isEditing
          ? `<input type="date" class="date-edit-input" value="${isoVal}"
               aria-label="Edit entry date"
               onchange="saveEditDate('${date}', this.value)"
               onblur="setState({editingDate:null})"
               autofocus />`
          : (() => {
              const sw = workoutById(entries[0].workoutId) || state.workouts.find(w => w.label === entries[0].session);
              return `${icons.cal} ${date}<span class="chip" style="margin-left:4px">${esc(sw?.name ?? entries[0].session)}</span>`;
            })();
        return `
        <div class="card card--glow">

  return `

// ============================================================
// PROGRESS SCREEN
// ============================================================
function renderProgressContent() {
  // Union of names in current workouts and names present in history — so
  // deleting or renaming a workout doesn't erase graphs for exercises that
  // still have logged history under their old name.
  const allNames = new Set([
    ...state.workouts.flatMap(w => w.exercises.map(e => e.name)),
    ...state.history.map(h => h.exercise),
  ]);
  const withData = [...allNames].filter(name => state.history.some(h => h.exercise === name));

  const selectedEx = (state.progressEx && withData.includes(state.progressEx))
    ? state.progressEx
    : (withData[0] ?? null);
  const mode       = state.progressMode;

  const dropdown = withData.length > 0 ? `
    <div class="mb-4">
      <label class="label" for="progressExerciseSelect">Exercise</label>
      <select id="progressExerciseSelect" class="graph-toggle-btn" aria-label="Select exercise" onchange="setState({progressEx:this.value})">
        ${withData.map(name => `<option value="${esc(name)}" ${name === selectedEx ? 'selected' : ''}>${esc(name)}</option>`).join('')}
      </select>
    </div>` : '';

  let graphHTML = '<div class="graph-empty">No data yet</div>';
  let statsHTML = '';

  if (selectedEx) {
    const points = getProgressData(selectedEx, mode);
    if (points.length < 2) {
      graphHTML = '<div class="graph-empty">Need at least 2 sessions to show graph</div>';
    } else {
      graphHTML = `<div class="graph-wrap">${buildGraphSVG(points, mode)}</div>`;
      const vals   = points.map(p => p.val);
      const latest = vals[vals.length - 1];
      const peak   = Math.max(...vals);
      const gain   = +(latest - vals[0]).toFixed(1);
      const gainStr = gain > 0 ? `+${gain}` : `${gain}`;
      const unit   = mode === 'volume' ? 'kg' : mode === '1rm' ? '' : 'kg';
      const fmt    = v => mode === 'volume' ? Math.round(v) : v;
      statsHTML = `
        <div class="graph-stat-row">
          <div class="graph-stat">
            <div class="graph-stat-val">${fmt(latest)}${unit}</div>
            <div class="graph-stat-lbl">Current</div>
          </div>
          <div class="graph-stat">
            <div class="graph-stat-val">${fmt(peak)}${unit}</div>
            <div class="graph-stat-lbl">Peak</div>
          </div>
          <div class="graph-stat" style="border-color:${gain >= 0 ? 'var(--green-dim)' : 'var(--red-dim)'}">
            <div class="graph-stat-val" style="color:${gain >= 0 ? 'var(--green)' : 'var(--red)'}">${gain >= 0 ? '+' : ''}${fmt(gain)}${unit}</div>
            <div class="graph-stat-lbl">Progress</div>
          </div>
        </div>`;
    }
  }

  return `
    ${dropdown}
    <div class="card card--glow">
      <div class="graph-toggle">
        <button type="button" class="graph-toggle-btn ${mode === 'weight' ? 'active' : ''}"
          onclick="setState({progressMode:'weight'})">Weight</button>
        <button type="button" class="graph-toggle-btn ${mode === '1rm' ? 'active' : ''}"
          onclick="setState({progressMode:'1rm'})">Est. 1RM</button>
        <button type="button" class="graph-toggle-btn ${mode === 'volume' ? 'active' : ''}"
          onclick="setState({progressMode:'volume'})">Volume</button>
      </div>
      ${graphHTML}
      ${statsHTML}
    </div>`;
}

function getProgressData(exName, mode) {
  const entries = state.history
    .filter(e => e.exercise === exName)
    .map(e => {
      const best = e.sets.reduce((b, s) => s.weight * (1 + s.reps / 30) > b.weight * (1 + b.reps / 30) ? s : b, e.sets[0]);
      let val;
      if (mode === '1rm') {
        val = Math.round(best.weight * (1 + best.reps / 30) * 10) / 10;
      } else if (mode === 'volume') {
        val = e.sets.reduce((sum, s) => sum + s.weight * s.reps, 0);
      } else {
        val = best.weight;
      }
      return { date: e.date.slice(0, 10), val };
    })
    .reverse();

  // Deduplicate — keep best per date
  const seen = {};
  for (const p of entries) {
    if (!seen[p.date] || p.val > seen[p.date]) seen[p.date] = p.val;
  }
  return Object.entries(seen).sort().map(([date, val]) => ({ date, val }));
}

function buildGraphSVG(points, mode) {
  if (points.length < 2) return null;

  const W = 320, H = 160, padL = 36, padR = 8, padT = 12, padB = 28;
  const vals  = points.map(p => p.val);
  const minV  = Math.min(...vals);
  const maxV  = Math.max(...vals);
  const range = maxV - minV || 1;

  const xScale = i => padL + (i / (points.length - 1)) * (W - padL - padR);
  const yScale = v => padT + (1 - (v - minV) / range) * (H - padT - padB);

  // Line path
  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xScale(i).toFixed(1)},${yScale(p.val).toFixed(1)}`).join(' ');

  // Area fill path
  const areaPath = `${linePath} L${xScale(points.length-1).toFixed(1)},${(H-padB).toFixed(1)} L${padL},${(H-padB).toFixed(1)} Z`;

  // Y axis labels (3 ticks)
  const yTicks = [minV, (minV + maxV) / 2, maxV].map((v) => {
    const y     = yScale(v);
    const label = mode === 'volume' ? Math.round(v).toString() : v.toFixed(mode === '1rm' ? 1 : 0);
    return `<text x="${padL - 4}" y="${y + 4}" text-anchor="end" fill="var(--text-dim)" font-size="9">${label}</text>`;
  });

  // X axis labels — show first, middle, last dates
  const xIdxs = [0, Math.floor((points.length - 1) / 2), points.length - 1];
  const xTicks = xIdxs.map(i => {
    const d = new Date(points[i].date);
    const label = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    return `<text x="${xScale(i).toFixed(1)}" y="${H - padB + 14}" text-anchor="middle" fill="var(--text-dim)" font-size="9">${label}</text>`;
  });

  // Dots on each point
  const dots = points.map((p, i) =>
    `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(p.val).toFixed(1)}" r="3" fill="var(--cyan)" />`
  ).join('');

  return `
    <svg class="graph-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--cyan)" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="var(--cyan)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#gfill)" />
      <path d="${linePath}" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${yTicks.join('')}
      ${xTicks.join('')}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--border)" stroke-width="1"/>
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border)" stroke-width="1"/>
    </svg>`;
}

        <div class="space-y-2 mt-3">

// ============================================================
(function initSwipe() {
  let startX = 0;
  let startY = 0;
  let startTime = 0;

  document.addEventListener('touchstart', e => {
    startX    = e.touches[0].clientX;
    startY    = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (state.view === 'select') return;
    const dx         = e.changedTouches[0].clientX - startX;
    const dy         = e.changedTouches[0].clientY - startY;
    const elapsed    = Date.now() - startTime;
    const isHoriz    = Math.abs(dx) > Math.abs(dy) * 1.5;
    const isFast     = elapsed < 350;
    const isRight    = dx > 60;
    const nearEdge   = startX < 40;

    if (isHoriz && isFast && isRight && nearEdge) goBack();
  }, { passive: true });
})();

// Note: no physical-keyboard handler here. The app is mobile-only; swipe-back
// (initSwipe above) covers back-navigation, and routing digit/Enter/Escape
// keys into the numpad was the mechanism that misrouted weight-field input.

// ============================================================
// RENDER DISPATCHER
// ============================================================
function render() {
  const app = document.getElementById('app');
  const ae  = document.activeElement;
  const keepId = ae && ae.id && app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) ? ae.id : null;

  switch (state.view) {
    case 'select':      app.innerHTML = renderSelect();      break;
    case 'workout':     app.innerHTML = renderWorkout();     break;
    case 'exercise':    app.innerHTML = renderExercise();    break;
    case 'history':     app.innerHTML = renderHistory();     break;
    case 'settings':    app.innerHTML = renderSettings();    break;
    case 'workouts':    app.innerHTML = renderWorkouts();    break;
    case 'workoutNew':  app.innerHTML = renderWorkoutNew();  break;
    case 'workoutEdit': app.innerHTML = renderWorkoutEdit(); break;
  }
  // Apply slide-back animation class
  if (_goingBack) {
    const screen = app.querySelector('.screen');
    if (screen) screen.classList.add('back');
  }
  if (keepId) {
    const el = document.getElementById(keepId);
    if (el) el.focus();
  }
}

// ============================================================
// BOOT
// ============================================================
initState();
render();

  window.addEventListener('load', () => {

  });
}
