<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Workout Tracker</title>
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workouts" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #070b14;
      --bg-card:    #0d1424;
      --bg-inner:   #111d35;
      --bg-deep:    #080f1e;
      --border:     #1a2540;
      --border-mid: #243050;
      --border-hi:  #2e3f6a;
      --cyan:       #22d3ee;
      --cyan-dim:   #0891b2;
      --cyan-glow:  rgba(34,211,238,0.12);
      --cyan-glow2: rgba(34,211,238,0.06);
      --white:      #e8f2ff;
      --muted:      #506888;
      --text-mid:   #8aadd4;
      --text-dim:   #607898;
      --green:      #22c55e;
      --green-dim:  #14532d;
      --green-bg:   #071a0f;
      --blue:       #60a5fa;
      --blue-dim:   #1e3a8a;
      --blue-bg:    #060f25;
      --red:        #f87171;
      --red-dim:    #7f1d1d;
      --red-bg:     #1a0808;
      --yellow:     #fbbf24;
      --yellow-dim: #78350f;
      --yellow-bg:  #1a1000;
      --amber:      #fbbf24;
      --orange:     #fb923c;
      --violet:       #a78bfa;
      --violet-dim:   #5b21b6;
      --violet-mid:   #7c3aed;
      --violet-glow:  rgba(167,139,250,0.14);
      --violet-glow2: rgba(167,139,250,0.07);

      /* Workout colour palette (index-based, stored per workout) */
      --wk0:#a78bfa; --wk0s:rgba(167,139,250,0.26);
      --wk1:#22d3ee; --wk1s:rgba(34,211,238,0.24);
      --wk2:#60a5fa; --wk2s:rgba(96,165,250,0.22);
      --wk3:#22c55e; --wk3s:rgba(34,197,94,0.22);
      --wk4:#fbbf24; --wk4s:rgba(251,191,36,0.24);
      --wk5:#fb923c; --wk5s:rgba(251,146,60,0.24);
      --wk6:#f87171; --wk6s:rgba(248,113,113,0.22);
      --wk7:#f472b6; --wk7s:rgba(244,114,182,0.22);
    }

    html, body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* Subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    #app { min-height: 100vh; position: relative; z-index: 1; }

    /* ── Screen fade ── */
    .screen {
      min-height: 100vh;
      /* top | right | bottom | left — insets must match their own side. */
      padding: 12px max(12px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      animation: fadeIn 0.18s ease;
    }
    @keyframes fadeIn    { from { opacity: 0; transform: translateY(6px); }   to { opacity: 1; transform: none; } }
    @keyframes slideBack { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    .screen          { animation: fadeIn    0.18s ease; }
    .screen.back     { animation: slideBack 0.2s ease; }

    .container      { max-width: 448px; margin: 0 auto; padding-top: 8px; }
    .container--home { padding-top: 28px; }

    /* ── Typography ── */
    .title-xl  { font-size: 1.5rem;   font-weight: 800; color: var(--white);    letter-spacing: -0.02em; }
    .title-lg  { font-size: 1.125rem; font-weight: 700; color: var(--white); }
    .title-sm  { font-size: 0.75rem;  font-weight: 700; color: var(--text-mid); letter-spacing: 0.08em; text-transform: uppercase; }
    .label     { font-size: 0.7rem;   color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; }
    .text-cyan { color: var(--cyan); }
    .text-muted { color: var(--muted); }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      position: relative;
    }
    .card--glow {
      box-shadow: 0 0 0 1px var(--border), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .card--inner {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .card--deep {
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    /* ── Buttons ── */
    button { cursor: pointer; border: none; font-family: inherit; transition: all 0.15s ease; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .btn-back {
      background: none;
      color: var(--text-dim);
      font-size: 0.75rem;
      padding: 0;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: var(--white);
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(22,163,74,0.3);
      letter-spacing: 0.02em;
    }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-mid);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .btn-danger {
      width: 100%;
      background: var(--red-bg);
      border: 1px solid var(--red-dim);
      color: var(--red);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.04em;
    }

    .btn-log {
      width: 100%;
      background: linear-gradient(135deg, var(--bg-inner), var(--bg-card));
      border: 1px solid var(--border-hi);
      color: var(--white);
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.02em;
      position: sticky;
      bottom: env(safe-area-inset-bottom, 0px);
      z-index: 5;
      box-shadow: 0 -8px 12px -4px var(--bg);
    }
    .btn-log:active:not(:disabled) { transform: scale(0.98); }
    .btn-log:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-complete-ex {
      width: 100%;
      background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(245,158,11,0.06));
      border: 1px solid var(--cyan-dim);
      color: var(--cyan);
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 16px var(--cyan-glow);
      letter-spacing: 0.02em;
    }
    .btn-complete-ex:active { transform: scale(0.98); }

    .btn-session {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }
    .btn-session::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--violet-glow2), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-nav {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .btn-resume {
      flex: 1;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: var(--white);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .btn-abandon {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-mid);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .btn-clear-all {
      background: none;
      color: var(--red-dim);
      border: 1px solid var(--red-dim);
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    .btn-delete-day {
      background: none;
      color: var(--red-dim);
      padding: 4px;
      line-height: 1;
      border-radius: 4px;
    }

    .btn-edit-day {
      background: none;
      color: var(--text-mid);
      padding: 4px;
      line-height: 1;
      border-radius: 4px;
    }

    .date-edit-input {
      background: var(--bg-inner);
      border: 1px solid var(--amber);
      border-radius: 6px;
      color: var(--white);
      font-size: 1rem;
      font-weight: 600;
      padding: 6px 8px;
      outline: none;
      color-scheme: dark;
    }


    .btn-export {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border-hi);
      color: var(--cyan);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    /* ── Inputs ── */
    input[type="number"], input[type="text"] {
      background: var(--bg-inner);
      color: var(--white);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      text-align: center;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: var(--cyan-dim);
      box-shadow: 0 0 0 3px var(--cyan-glow);
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .input-weight {
      font-size: 1.375rem;
      font-weight: 700;
      padding: 10px;
      flex: 1;
      color: var(--cyan);
    }
    /* ── Progress bar ── */
    .progress-bar-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .progress-bar-track {
      background: var(--bg-deep);
      border-radius: 9999px;
      height: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(to right, var(--violet-mid), var(--cyan));
      height: 100%;
      border-radius: 9999px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 8px rgba(245,158,11,0.4);
    }
    .progress-bar-labels { display: flex; justify-content: space-between; }

    /* ── Exercise list item ── */
    .exercise-item {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--white);
      transition: border-color 0.15s, background 0.15s;
    }
    .exercise-item:active { transform: scale(0.99); }
    .exercise-item.done    { border-color: var(--border); background: rgba(245,158,11,0.03); }
    .exercise-item.partial { border-color: var(--cyan-dim); background: rgba(245,158,11,0.03); }
    .exercise-item.skipped { opacity: 0.5; }

    /* ── Session-local reorder / skip controls ── */
    .exercise-row-controls {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .exercise-row-controls .icon-btn { flex: 0 0 auto; padding: 10px; }
    .btn-skip-toggle {
      flex: 1;
      background: var(--bg-inner);
      border: 1px solid var(--border-mid);
      color: var(--text-dim);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .btn-skip-toggle.active { color: var(--yellow); border-color: var(--yellow-dim); background: var(--yellow-bg); }

    /* ── Set rows (with slide-in animation) ── */
    .set-row-wrap {
      animation: slideIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-inner);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
    }
    .set-row-tap {
      width: 100%;
      text-align: left;
      color: inherit;
      font-family: inherit;
    }
    .set-edit-hint { color: var(--muted); display: inline-flex; }
    .set-row-editing {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      border-color: var(--cyan-dim);
    }
    .set-edit-fields { display: flex; align-items: center; gap: 8px; }
    .set-edit-input { flex: 1; padding: 12px 8px; font-size: 1rem; }
    .set-edit-x { color: var(--text-dim); font-weight: 700; flex-shrink: 0; }
    .set-edit-actions { display: flex; gap: 8px; }
    .set-edit-actions .icon-btn { flex: 1; justify-content: center; padding: 12px; }

    /* ── PR badges (with pop animation) ── */
    .pr-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .pr-badge {
      background: linear-gradient(135deg, rgba(167,139,250,0.18), rgba(167,139,250,0.08));
      border: 1px solid rgba(167,139,250,0.35);
      color: var(--violet);
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: prPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: 0.02em;
    }
    @keyframes prPop {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Progression status ── */
    .progression {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .progression.increase { background: var(--green-bg);  border: 1px solid var(--green-dim);  color: var(--green); }
    .progression.good     { background: var(--blue-bg);   border: 1px solid var(--blue-dim);   color: var(--blue); }
    .progression.maintain { background: var(--yellow-bg); border: 1px solid var(--yellow-dim); color: var(--yellow); }



    /* ── Exercise accent bar ── */
    .ex-header {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin-bottom: 14px;
    }
    .ex-accent-bar {
      width: 3px;
      border-radius: 9999px;
      flex-shrink: 0;
    }
    .ex-accent-bar.wk-accent { background: linear-gradient(to bottom, var(--wk), var(--wks)); }

    /* ── Filled checkmark ── */
    .check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(34,197,94,0.4);
    }
    .check-circle svg { display: block; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      border: 1px dashed var(--border-mid);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .empty-state-icon { font-size: 2rem; margin-bottom: 8px; }
    .empty-state-title { font-size: 0.875rem; font-weight: 700; color: var(--text-mid); margin-bottom: 4px; }
    .empty-state-sub { font-size: 0.75rem; color: var(--text-dim); line-height: 1.5; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-item { text-align: center; padding: 10px 6px; }

    /* ── Resume banner ── */
    .resume-banner {
      background: linear-gradient(135deg, rgba(37,99,235,0.15), rgba(37,99,235,0.06));
      border: 1px solid #1e3a8a;
      border-radius: 12px;
      padding: 14px;
    }


    /* ── Utility ── */
    .space-y-2 > * + * { margin-top: 8px; }
    .space-y-3 > * + * { margin-top: 12px; }
    .flex       { display: flex; }
    .flex-row   { display: flex; gap: 8px; }
    .gap-2      { gap: 8px; }
    .mt-1       { margin-top: 4px; }
    .mt-2       { margin-top: 8px; }
    .mt-3       { margin-top: 12px; }
    .mt-4       { margin-top: 16px; }
    .mb-1       { margin-bottom: 4px; }
    .mb-2       { margin-bottom: 8px; }
    .mb-3       { margin-bottom: 12px; }
    .mb-4       { margin-bottom: 16px; }
    .mb-6       { margin-bottom: 24px; }
    .text-center { text-align: center; }
    .grid-2     { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.75rem; }
    .divider    { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 0.7rem;
      color: var(--text-mid);
    }
    .note-box {
      background: rgba(251,191,36,0.06);
      border: 1px solid rgba(251,191,36,0.2);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.75rem;
      color: var(--yellow);
    }
    .modified-label { color: var(--yellow); font-size: 0.7rem; margin-top: 6px; text-align: center; }
    .chevron { color: var(--muted); flex-shrink: 0; }

    /* ── Calendar ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-top: 8px;
    }
    .cal-day-label {
      text-align: center;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-day {
      height: 30px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      background: transparent;
      position: relative;
    }
    .cal-day.empty { pointer-events: none; }
    .cal-day.today { color: var(--white); }
    .cal-day.today::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--cyan);
    }
    .cal-day.worked {
      background: linear-gradient(135deg, var(--wks), transparent);
      border: 1px solid var(--wks);
      color: var(--wk);
      font-weight: 800;
    }
    .cal-nav {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      padding: 2px 8px;
      border-radius: 4px;
      line-height: 1;
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-dim);
      background: transparent;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--white);
      box-shadow: 0 1px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* ── Select dropdown ── */
    select {
      width: 100%;
      background: var(--bg-inner);
      color: var(--white);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

async function syncToSheets(entries) {
  if (!SHEETS_URL) return;
  try {

      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entries),

// STORAGE
// ============================================================
const safeJsonParse = (value) => {
  try {
    return JSON.parse(value);
  } catch {
    return null;
  }
};

const loadLS = (key, fallback = null) => {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    const parsed = safeJsonParse(raw);
    return parsed === null ? fallback : parsed;
  } catch (e) {
    console.warn('localStorage load failed:', e);
    return fallback;
  }
};

const saveLS = (key, value) => {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('localStorage save failed:', e);
  }
};

const removeLS = (key) => {
  try {
    localStorage.removeItem(key);
  } catch (e) {
    console.warn('localStorage remove failed:', e);
  }
};

function isValidHistory(data) {
  return Array.isArray(data) && data.every(entry =>
    entry && typeof entry.date === 'string' && typeof entry.exercise === 'string' &&
    Array.isArray(entry.sets) &&
    // Set contents matter too: a malformed sets:[null] passes an
    // Array.isArray check and then throws on s.weight during render.
    entry.sets.every(s => s && Number.isFinite(s.weight) && Number.isFinite(s.reps)));
}

function isValidSession(data) {
  // order/skipped are optional session-local additions (Feature: reorder/skip
  // exercises for the current session) — absent entirely on older in-flight
  // sessions, which must keep loading, so only type-check them when present.
  return data && typeof data === 'object' &&
         typeof data.sessionType === 'string' &&
         Array.isArray(data.exercises) &&
         data.exercises.every(ex => ex && typeof ex.exercise === 'string' && Array.isArray(ex.sets)) &&
         (data.order === undefined || Array.isArray(data.order)) &&
         (data.skipped === undefined || Array.isArray(data.skipped));
}

// targetReps are load-bearing. Everything else (label/color/notes/rest/
// targetSets/exercise id) gets repaired by normalizeWorkouts() rather than
// triggering a destructive reset. An empty array is a VALID state — it means
// the user deleted every workout.
function isValidWorkouts(data) {
  return Array.isArray(data) && data.every(w =>
    w && typeof w === 'object' &&
    typeof w.id === 'string' && w.id.length > 0 &&
    typeof w.name === 'string' &&
    Array.isArray(w.exercises) &&
    w.exercises.every(ex =>
      ex && typeof ex === 'object' &&
      typeof ex.name === 'string' &&
      typeof ex.weight === 'number' &&
      typeof ex.targetReps === 'string'));
}

function normalizeWorkouts(data) {
  return data.map((w, wi) => ({
    id: w.id,
    name: w.name,
    label: (typeof w.label === 'string' && w.label.trim()) ? w.label.trim().slice(0, 3) : w.name.slice(0, 3).toUpperCase(),
    color: (Number.isInteger(w.color) && w.color >= 0 && w.color < WK_PALETTE_SIZE) ? w.color : (wi % WK_PALETTE_SIZE),
    exercises: w.exercises.map(ex => ({
      id: (typeof ex.id === 'string' && ex.id) ? ex.id : newId('e'),
      name: ex.name,
      weight: ex.weight,
      targetReps: ex.targetReps,
      rest: typeof ex.rest === 'string' ? ex.rest : '',
      notes: typeof ex.notes === 'string' ? ex.notes : '',
      targetSets: clampSets(Number.isFinite(ex.targetSets) ? ex.targetSets : DEFAULT_TARGET_SETS),
    })),
  }));

function initState() {
  // Seed FitNotes history on first load if localStorage is empty
  const hasHistoryKey = localStorage.getItem('workoutHistory') !== null;
  if (!hasHistoryKey) {
    saveLS('workoutHistory', SEED_HISTORY);
  }

  const persistedHistory = loadLS('workoutHistory', null);
  if (!hasHistoryKey) {
    state.history = SEED_HISTORY;
  } else if (!isValidHistory(persistedHistory)) {
    console.warn('Invalid workoutHistory in localStorage, resetting to empty history.');
    state.history = [];
    saveLS('workoutHistory', []);
  } else {
    state.history = persistedHistory;
  }

  // ── Workouts (user-definable; seeded from templates A/B/C on first load).
  // Must be resolved BEFORE currentSession below, since a persisted session's
  // sessionType needs to resolve against a real workout.
  const hasWorkoutsKey = localStorage.getItem('workouts') !== null;
  if (!hasWorkoutsKey) {
    state.workouts = buildSeedWorkouts();
    saveLS('workouts', state.workouts);
  } else {
    const persistedWorkouts = loadLS('workouts', null);
    if (!isValidWorkouts(persistedWorkouts)) {
      console.warn('Invalid workouts in localStorage, reseeding from templates.');
      state.workouts = buildSeedWorkouts();
      saveLS('workouts', state.workouts);
    } else {
      state.workouts = normalizeWorkouts(persistedWorkouts);
      saveLS('workouts', state.workouts);
    }
  }

  const persistedSession = loadLS('currentSession', null);
  if (persistedSession === null) {
    state.activeSession = null;
  } else if (!isValidSession(persistedSession)) {
    console.warn('Invalid currentSession in localStorage, removing it.');
    removeLS('currentSession');
    state.activeSession = null;
  } else if (!workoutById(persistedSession.sessionType)) {
    console.warn('currentSession references a workout that no longer exists, discarding it.');
    removeLS('currentSession');
    state.activeSession = null;
  } else {
    state.activeSession = persistedSession;
  }
}

let _goingBack = false;

// Snapshot of { exerciseId: originalName } taken when the workout editor is
// opened, used only to detect renames at Save time (so a history rewrite can
// be offered). Not a copy of workout data — state.workouts stays the single
// source the editor renders from.
let editSnapshot = {};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ── Live-patch helpers ──────────────────────────────────────
// Update `state` WITHOUT re-rendering, then patch only the nodes we own.
// render() replaces app.innerHTML wholesale, which destroys the element the
// user is currently typing into (and dismisses the mobile keyboard), so any
// control that updates on keystroke must go through these instead of setState.
function setStateSilent(patch) { Object.assign(state, patch); }

function syncRepUI() {
  const btn = document.getElementById('btnLogSet');
  if (btn) btn.disabled = !(state.repInput && Number(state.repInput) > 0);
}

function syncModifiedLabel() {
  const el = document.getElementById('modifiedLabel');
  if (!el) return;
  const ref  = getExerciseHistory(state.activeExercise?.name || '')[0]?.sets?.[0]?.weight;
  const show = ref !== undefined && state.weight !== ref;
  el.textContent   = show ? `↕ Modified from last session (${ref}kg)` : '';
  el.style.display = show ? '' : 'none';
}

function goBack() {
  _goingBack = true;
  switch (state.view) {
    case 'workout': {
      // If the user browsed a different session without logging any sets,
      // restore the saved session from localStorage so the resume banner stays intact.
      const savedSession = loadLS('currentSession', null);
      const shouldRestore = isValidSession(savedSession)
        && state.activeSession?.exercises?.length === 0
        && savedSession.sessionType !== state.activeSession?.sessionType;
      setState({ view: 'select', sessionType: null, ...(shouldRestore ? { activeSession: savedSession } : {}) });
      break;
    }
    case 'exercise': setState({ view: 'workout', activeExercise: null, sets: [], repInput: '', editingSetIdx: null }); break;
    case 'history':  setState({ view: 'select' }); break;
    case 'settings': setState({ view: 'select' }); break;
    case 'workouts':    setState({ view: 'select' }); break;
    case 'workoutNew':  setState({ view: 'workouts' }); break;
    case 'workoutEdit': {
      // Structural action — harvest whatever the user last typed before it's discarded.
      harvestEditorDOM();
      saveLS('workouts', state.workouts);
      setState({ view: 'workouts', editWorkoutId: null });
      break;
    }
  }
  _goingBack = false;
}

function detectPRs(exerciseName, newSet, currentSets) {
  const ex         = state.history.filter(e => e.exercise === exerciseName);
  const shownTypes = new Set(currentSets.flatMap(s => (s.prs || []).map(p => p.type)));
  const allSets    = ex.flatMap(h => h.sets);
  const prs        = [];

  // No prior history means there is no record to beat. Without this, the
  // Math.max(0, ...[]) baselines below are 0, so the first set of any newly
  // added exercise wins weight, rep and volume PRs simultaneously.
  if (!allSets.length) return prs;

  const maxWeight = Math.max(0, ...allSets.map(s => s.weight));
  if (newSet.weight > maxWeight && !shownTypes.has('weight'))
    prs.push({ type: 'weight', icon: '⭐', message: 'Weight PR!' });

  // Scoped to this exact weight, so it only means anything if this weight has
  // been lifted before. Without that check the baseline is 0 for any weight
  // never used, and a single rep at a weight far below the historical max
  // wins a "Rep PR!" that then gets written into history with the set.
  const repsAtWeight    = allSets.filter(s => s.weight === newSet.weight).map(s => s.reps);
  const maxRepsAtWeight = Math.max(0, ...repsAtWeight);
  if (repsAtWeight.length > 0 && newSet.reps > maxRepsAtWeight && !shownTypes.has('reps'))
    prs.push({ type: 'reps', icon: '🔥', message: 'Rep PR!' });

  const maxVolume = Math.max(0, ...allSets.map(s => s.weight * s.reps));
  if (newSet.weight * newSet.reps > maxVolume && !shownTypes.has('volume'))
    prs.push({ type: 'volume', icon: '💪', message: 'Volume PR!' });

  return prs;
}

function getProgressionStatus(exercise, sets) {
  if (sets.length < targetSetsFor(exercise)) return null;
  const [min, max] = (exercise.targetReps || '').split('-').map(Number);
  // Free-text targets ("AMRAP", a bare "10", etc.) don't parse as a min-max
  // range — skip the banner rather than pinning it to "Push for more reps" forever.
  if (!Number.isFinite(min) || !Number.isFinite(max)) return null;
  if (sets.every(s => s.reps >= max)) return { status: 'increase', message: '✓ MAXED — increase weight next session' };
  if (sets.every(s => s.reps >= min)) return { status: 'good',     message: '✓ Good — keep pushing' };
  return                                      { status: 'maintain', message: '↑ Push for more reps' };
}

function getExerciseHistory(name) {
  return state.history.filter(e => e.exercise === name).slice(0, 5);
}

// A logged session entry whose exercise has since been removed from (or
// renamed in) the workout still holds real sets the user performed, but it no
// longer has a row on the workout screen. Counting it would make the progress
// summary disagree with the visible list — "1/0" when the workout is emptied
// mid-session — so the counts below cover only exercises still in the workout,
// and orphanedExercises() surfaces the rest. Nothing is discarded:
// completeSession still writes every logged entry to history.
function sessionEntriesInWorkout() {
  const names = new Set((currentWorkout()?.exercises || []).map(e => e.name));
  return (state.activeSession?.exercises || []).filter(e => names.has(e.exercise));
}

function completedExercises() {
  // Only count exercises where the target number of sets is logged
  return sessionEntriesInWorkout()
    .filter(e => e.sets.length >= targetSetsFor(e.exercise))
    .map(e => e.exercise);
}

function partialExercises() {
  // Exercises saved with fewer than the target number of sets
  return sessionEntriesInWorkout()
    .filter(e => e.sets.length < targetSetsFor(e.exercise))
    .map(e => ({ name: e.exercise, sets: e.sets.length, target: targetSetsFor(e.exercise) }));
}

// Logged entries no longer present in the workout definition.
function orphanedExercises() {
  const names = new Set((currentWorkout()?.exercises || []).map(e => e.name));
  return (state.activeSession?.exercises || [])
    .filter(e => !names.has(e.exercise) && e.sets.length > 0)
    .map(e => ({ name: e.exercise, sets: e.sets.length }));
}

// ── Session-local reorder / skip ────────────────────────────────────────
// The workout definition's exercise order is never touched here — these
// helpers only resolve a DISPLAY order for the active session, backed by
// state.activeSession.order (names) and .skipped (names), persisted with the
// session (not with `workouts`). Resolved defensively, same spirit as
// orphanedExercises() above: a stored order entry that no longer names a
// real exercise in the workout is dropped (never rendered as a phantom row),
// and a workout exercise missing from the stored order (added to the
// workout after the session started, or the field predates this feature)
// is appended in the workout's own order.
function sessionExerciseOrder() {
  const defNames = (currentWorkout()?.exercises || []).map(e => e.name);
  const order = state.activeSession?.order;
  if (!Array.isArray(order) || order.length === 0) return defNames;
  const defSet = new Set(defNames);
  const known   = order.filter(n => defSet.has(n));
  const missing = defNames.filter(n => !known.includes(n));
  return [...known, ...missing];
}

// The current workout's exercise defs, in this session's display order.
function orderedExercises() {
  const byName = new Map((currentWorkout()?.exercises || []).map(e => [e.name, e]));
  return sessionExerciseOrder().map(n => byName.get(n)).filter(Boolean);
}

function isSkipped(name) {
  return (state.activeSession?.skipped || []).includes(name);
}

// Exercises counted toward "done/total" — a skipped exercise is excluded
// from the denominator so skipping the last remaining one lets the session
// complete cleanly. Nothing is removed from the workout or from the session's
// logged entries; a skipped exercise with sets already logged still shows,
// still saves on completion, it just doesn't hold the count back.
function activeWorkoutExercises() {
  return (currentWorkout()?.exercises || []).filter(e => !isSkipped(e.name));
}

function getQuickStats() {
  const sessionDates = [...new Set(state.history.map(e => new Date(e.date).toDateString()))];
  if (!sessionDates.length) return null;
  const daysAgo = Math.floor((Date.now() - new Date(sessionDates[0])) / 86400000);
  const totalSessions = sessionDates.length;
  const now       = new Date();
  const dayOfWeek = (now.getDay() + 6) % 7; // Mon=0 ... Sun=6
  const monday    = new Date(now);
  monday.setHours(0, 0, 0, 0);
  monday.setDate(now.getDate() - dayOfWeek);
  const thisWeek  = sessionDates.filter(d => new Date(d) >= monday).length;
  return {
    lastWorkout: daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : `${daysAgo}d ago`,
    totalSessions,
    thisWeek,
  };
}

function getBestSet(exerciseName) {
  const all = state.history.filter(e => e.exercise === exerciseName).flatMap(e => e.sets);
  if (!all.length) return null;
  // Best = highest volume set, then show weight × reps
  return all.reduce((best, s) => (s.weight * s.reps > best.weight * best.reps ? s : best));
}

// ── Workout helpers ─────────────────────────────────────────
function newId(prefix) {
  return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;
}

function clampSets(n) {
  // An empty editor field means "unset", not zero: Number('') is 0, which is
  // finite, so without this it would clamp to the floor of 1 instead of the
  // default of 3 that every other unset path uses.
  if (n === null || n === undefined) return DEFAULT_TARGET_SETS;
  if (typeof n === 'string' && n.trim() === '') return DEFAULT_TARGET_SETS;
  const v = Math.round(Number(n));
  if (!Number.isFinite(v)) return DEFAULT_TARGET_SETS;
  return Math.min(10, Math.max(1, v));
}

function workoutById(id) {
  return state.workouts.find(w => w.id === id) || null;
}

function currentWorkout() {
  return workoutById(state.sessionType);
}

// Resolve any of {workout id, label, name} to a real workout id, or null.
function resolveWorkoutId(v) {
  if (!v) return null;
  const byId = state.workouts.find(w => w.id === v);
  if (byId) return byId.id;
  const byLabel = state.workouts.find(w => w.label === v);
  if (byLabel) return byLabel.id;
  const byName = state.workouts.find(w => w.name === v);
  if (byName) return byName.id;
  return null;
}

function exDefByName(name, w) {
  return (w?.exercises || []).find(e => e.name === name) || null;
}

// Accepts either an exercise def (object with .targetSets) or an exercise
// name string to look up within the current workout. Falls back to
// DEFAULT_TARGET_SETS when the def was deleted mid-session.
function targetSetsFor(nameOrDef) {
  const def = typeof nameOrDef === 'string' ? exDefByName(nameOrDef, currentWorkout()) : nameOrDef;
  return clampSets(def?.targetSets ?? DEFAULT_TARGET_SETS);
}

function hashLabelToIndex(label) {
  let h = 0;
  const s = String(label || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h % WK_PALETTE_SIZE;
}

// Never returns undefined — an undefined index would emit var(--wkundefined)
// in an inline style and render an invisible calendar day.
function colorForHistoryEntry(e) {
  const w = workoutById(e.workoutId) || state.workouts.find(w => w.label === e.session);
  if (w && Number.isInteger(w.color)) return w.color;
  return hashLabelToIndex(e.session);
}

function wkStyle(i) {
  const idx = Number.isInteger(i) ? ((i % WK_PALETTE_SIZE) + WK_PALETTE_SIZE) % WK_PALETTE_SIZE : 0;
  return `--wk:var(--wk${idx});--wks:var(--wk${idx}s)`;
}

// ============================================================
// ACTIONS
// ============================================================
function startSession(id) {
  if (!workoutById(id)) return;
  if (state.activeSession?.sessionType === id) {
    saveLS('currentSession', state.activeSession);
    setState({ view: 'workout', sessionType: id });
    return;
  }
  const session = { sessionType: id, exercises: [], startedAt: new Date().toISOString() };
  // Don't commit to localStorage yet — only saved when the first set is added,
  // so browsing a different session never wipes in-progress progress.
  setState({ view: 'workout', sessionType: id, activeSession: session });
}

function resumeSession() {
  setState({ view: 'workout', sessionType: state.activeSession.sessionType });
}

function abandonSession() {
  if (!confirm('Abandon session? All progress will be lost.')) return;
  removeLS('currentSession');
  setState({ view: 'select', sessionType: null, activeSession: null });
}

function completeSession() {
  const validExercises = (state.activeSession?.exercises || []).filter(e => e.sets.length > 0);
  if (!validExercises.length) return;
  const workout = currentWorkout();
  const ts      = new Date().toISOString();
  const entries = validExercises.map(ex => ({
    ...ex, date: ts,
    session: workout?.label ?? state.activeSession.sessionType,
    workoutId: state.activeSession.sessionType,
  }));
  const history = [...entries, ...state.history];
  saveLS('workoutHistory', history);
  removeLS('currentSession');
  // The Google Sheets endpoint is a black box that expects the original
  // shape — strip the new workoutId field at the boundary.
  syncToSheets(entries.map(({ workoutId, ...rest }) => rest));
  setState({ view: 'select', sessionType: null, activeSession: null, history });
}

function selectExercise(idx) {
  // idx indexes the session's DISPLAY order (orderedExercises), which may
  // differ from the workout definition's own order once the exercise has
  // been reordered for this session.
  const ex = orderedExercises()[idx];
  if (!ex) return;
  const history    = getExerciseHistory(ex.name);
  const lastWeight = history[0]?.sets[0]?.weight ?? ex.weight;
  // Restore any partial sets already saved for this exercise in the current session
  const savedEntry = state.activeSession?.exercises.find(e => e.exercise === ex.name);
  const sets       = savedEntry ? savedEntry.sets : [];
  const weight     = sets.length > 0 ? sets[sets.length - 1].weight : lastWeight;
  const repInput = sets.length > 0 ? String(sets[sets.length - 1].reps) : '';
  setState({ view: 'exercise', activeExercise: ex, sets, weight, repInput, editingSetIdx: null });
}

function saveExerciseToSession(sets) {
  // Upsert current exercise into active session — replaces existing entry if present
  const entry    = { exercise: state.activeExercise.name, sets };
  const existing = state.activeSession.exercises.findIndex(e => e.exercise === entry.exercise);
  const exercises = existing >= 0
    ? state.activeSession.exercises.map((e, i) => i === existing ? entry : e)
    : [...state.activeSession.exercises, entry];
  const session = { ...state.activeSession, exercises };
  saveLS('currentSession', session);
  return session;
}

function onRepsInput(el) {
  // Same badInput guard as onWeightInput: value === '' covers both an empty
  // field and a mid-typed value the parser rejects, so bail out on the latter
  // rather than zeroing state while the field still shows a rejected value.
  if (el.value === '') {
    if (el.validity && el.validity.badInput) return;
    setStateSilent({ repInput: '' });
  } else {
    const n = parseInt(el.value, 10);
    if (!Number.isFinite(n) || n < 0) return;
    setStateSilent({ repInput: String(n) });
  }
  syncRepUI();
}

function onRepsBlur(el) {
  const n = parseInt(el.value, 10);
  const v = Number.isFinite(n) && n > 0 ? String(n) : '';
  setStateSilent({ repInput: v });
  el.value = v;
  syncRepUI();
}

function onWeightInput(el) {
  // An input[type=number] reports value === '' for BOTH an empty field and a
  // mid-typed value the parser rejects ("82.", "8e"). Zeroing state on the
  // latter would make the next logged set record 0kg while the field visibly
  // reads "82.", so bail out and wait for the next keystroke instead.
  if (el.value === '') {
    if (el.validity && el.validity.badInput) return;
    setStateSilent({ weight: 0 });
  } else {
    const n = parseFloat(el.value);
    if (!Number.isFinite(n) || n < 0) return;
    setStateSilent({ weight: n });
  }
  syncModifiedLabel();
}

function onWeightBlur(el) {
  const n = parseFloat(el.value);
  const v = Number.isFinite(n) && n >= 0 ? n : 0;
  setStateSilent({ weight: v });
  el.value = String(v);   // normalise "82." → "82" and "" → "0", but only on blur
  syncModifiedLabel();
}

function addSet() {
  const reps = parseInt(state.repInput);
  if (!reps || reps <= 0) return;
  const newSet   = { reps, weight: state.weight, prs: detectPRs(state.activeExercise.name, { reps, weight: state.weight }, state.sets) };
  const sets     = [...state.sets, newSet];
  const repInput = sets.length < targetSetsFor(state.activeExercise) ? String(reps) : '';
  // Auto-save after every set
  const session  = saveExerciseToSession(sets);
  setState({ sets, repInput, activeSession: session });
}

// Shared by removeLastSet/deleteSet/confirmEditSet: persists whatever sets
// remain for the active exercise, or — if none remain — drops the exercise
// from the session entirely (same behaviour removeLastSet always had, now
// reused instead of duplicated per call site).
function persistSets(sets) {
  if (sets.length > 0) return saveExerciseToSession(sets);
  const exercises = state.activeSession.exercises.filter(e => e.exercise !== state.activeExercise.name);
  const session = { ...state.activeSession, exercises };
  saveLS('currentSession', session);
  return session;
}

// Recomputes every set's `prs` from scratch, in order, so that editing or
// deleting an earlier set can never leave a later set's PR badge referring to
// a comparison that no longer holds. Mirrors exactly how addSet() computes a
// PR — detectPRs(name, thisSet, setsLoggedBeforeIt) — just replayed over the
// whole (possibly just-edited) array instead of appending one at a time.
function recomputeSetsPRs(exerciseName, sets) {
  const result = [];
  for (const s of sets) {
    const prs = detectPRs(exerciseName, s, result);
    result.push({ weight: s.weight, reps: s.reps, prs });
  }
  return result;
}

function removeLastSet() {
  const sets    = state.sets.slice(0, -1);
  const session = persistSets(sets);
  setState({ sets, activeSession: session });
}

// ── Per-set inline edit (any logged set, not just the last one) ──────────
function deleteSet(idx) {
  const remaining = state.sets.filter((_, i) => i !== idx).map(s => ({ weight: s.weight, reps: s.reps }));
  const recomputed = recomputeSetsPRs(state.activeExercise.name, remaining);
  const session = persistSets(recomputed);
  setState({ sets: recomputed, activeSession: session, editingSetIdx: null });
}

// The edit row's weight/reps inputs are UNCONTROLLED (same reasoning as the
// workout editor's harvestEditorDOM) — nothing re-renders while the row is
// open, so this reads the live DOM values only at confirm time, the single
// structural action that follows.
function confirmEditSet(idx) {
  const set = state.sets[idx];
  if (!set) { setState({ editingSetIdx: null }); return; }
  const wEl = document.getElementById('editSetWeight');
  const rEl = document.getElementById('editSetReps');
  const wN  = wEl ? parseFloat(wEl.value) : NaN;
  const weight = Number.isFinite(wN) && wN >= 0 ? wN : set.weight;
  const rN  = rEl ? parseInt(rEl.value, 10) : NaN;
  const reps = Number.isFinite(rN) && rN > 0 ? rN : set.reps;
  const updated    = state.sets.map((s, i) => i === idx ? { weight, reps } : { weight: s.weight, reps: s.reps });
  const recomputed = recomputeSetsPRs(state.activeExercise.name, updated);
  const session     = persistSets(recomputed);
  setState({ sets: recomputed, activeSession: session, editingSetIdx: null });
}

// ── Session-local reorder / skip (workout definition is never touched) ───
function moveSessionExercise(idx, dir) {
  const list = orderedExercises();
  const j = idx + dir;
  if (j < 0 || j >= list.length) return;
  const names = list.map(e => e.name);
  [names[idx], names[j]] = [names[j], names[idx]];
  const session = { ...state.activeSession, order: names };
  saveLS('currentSession', session);
  setState({ activeSession: session });
}

function toggleSkipExercise(idx) {
  const ex = orderedExercises()[idx];
  if (!ex) return;
  const skipped = new Set(state.activeSession?.skipped || []);
  if (skipped.has(ex.name)) skipped.delete(ex.name); else skipped.add(ex.name);
  const session = { ...state.activeSession, skipped: [...skipped] };
  saveLS('currentSession', session);
  setState({ activeSession: session });
}

function completeExercise() {
  const session = saveExerciseToSession(state.sets);
  setState({ view: 'workout', activeSession: session, activeExercise: null, sets: [], weight: 0, repInput: '', editingSetIdx: null });
}

function deleteHistoryDay(dateStr) {
  if (!confirm(`Delete all entries for ${dateStr}?`)) return;
  const deletedEntries = state.history.filter(e => new Date(e.date).toLocaleDateString() === dateStr);
  if (!deletedEntries.length) return;
  const history = state.history.filter(e => new Date(e.date).toLocaleDateString() !== dateStr);
  saveLS('workoutHistory', history);
  setState({ history, lastDeletedHistory: { dateStr, entries: deletedEntries } });
}

function undoDeleteHistoryDay() {
  if (!state.lastDeletedHistory) return;
  const history = [...state.history, ...state.lastDeletedHistory.entries]
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  saveLS('workoutHistory', history);
  setState({ history, lastDeletedHistory: null });
}

function saveEditDate(oldDateStr, newISODate) {
  if (!newISODate) { setState({ editingDate: null }); return; }
  const history = state.history.map(e => {
    if (new Date(e.date).toLocaleDateString() !== oldDateStr) return e;
    const old = new Date(e.date);
    const [y, m, d] = newISODate.split('-').map(Number);
    const updated = new Date(old);
    updated.setFullYear(y, m - 1, d);
    return { ...e, date: updated.toISOString() };
  });
  // Re-sort: several reads take history as newest-first (getExerciseHistory's
  // "Last session", getQuickStats' "last workout", renderWorkout's trend
  // arrows), and moving an entry's date leaves it in its old array position.
  history.sort((a, b) => new Date(b.date) - new Date(a.date));
  saveLS('workoutHistory', history);
  setState({ history, editingDate: null });
}

function clearAllHistory() {
  if (!confirm('Clear ALL workout history? This cannot be undone.')) return;
  saveLS('workoutHistory', []);
  removeLS('currentSession');
  setState({ history: [], lastDeletedHistory: null, activeSession: null, sessionType: null });
}

function exportHistory() {
  const data = JSON.stringify(state.history, null, 2);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(data)
      .then(() => alert('Copied! Paste into Claude.'))
      .catch(() => alert('Copy failed — try again.'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = data; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    alert(ok ? 'Copied! Paste into Claude.' : 'Copy failed — try again.');
  }
}

// ============================================================
// WORKOUT EDITOR
// ============================================================
// Editor inputs are UNCONTROLLED (value written once per render, no setState
// on keystroke) so typing never triggers a re-render that would blow away the
// input the user is mid-edit in and dismiss the mobile keyboard. Every
// structural action therefore harvests the live DOM values into the actual
// state.workouts entry FIRST, before it mutates anything or re-renders.
function harvestEditorDOM() {
  const w = workoutById(state.editWorkoutId);
  if (!w) return;
  const nameEl  = document.getElementById('wkNameInput');
  const labelEl = document.getElementById('wkLabelInput');
  if (nameEl)  w.name  = nameEl.value;
  if (labelEl) w.label = labelEl.value;

  document.querySelectorAll('[data-ex-idx]').forEach(rowEl => {
    const idx = Number(rowEl.getAttribute('data-ex-idx'));
    const ex  = w.exercises[idx];
    if (!ex) return;
    rowEl.querySelectorAll('[data-f]').forEach(fieldEl => {
      const f = fieldEl.getAttribute('data-f');
      if (f === 'weight') {
        const n = parseFloat(fieldEl.value);
        ex.weight = Number.isFinite(n) && n >= 0 ? n : 0;
      } else if (f === 'targetSets') {
        ex.targetSets = clampSets(fieldEl.value);
      } else {
        ex[f] = fieldEl.value;
      }
    });
  });
}

function openWorkoutEditor(id) {
  const w = workoutById(id);
  if (!w) return;
  editSnapshot = {};
  w.exercises.forEach(ex => { editSnapshot[ex.id] = ex.name; });
  setState({ view: 'workoutEdit', editWorkoutId: id });
}

function createWorkout(templateKey) {
  const nextColor = state.workouts.length % WK_PALETTE_SIZE;
  let w;
  if (templateKey && WORKOUTS[templateKey]) {
    w = {
      id: newId('w'),
      name: `Session ${templateKey} copy`,
      label: templateKey,
      color: nextColor,
      exercises: WORKOUTS[templateKey].map(ex => ({
        id: newId('e'),
        name: ex.name,
        weight: ex.weight,
        targetReps: ex.targetReps,
        rest: ex.rest || '',
        notes: ex.notes || '',
        targetSets: DEFAULT_TARGET_SETS,
      })),
    };
  } else {
    w = { id: newId('w'), name: 'New Workout', label: 'NEW', color: nextColor, exercises: [] };
  }
  const workouts = [...state.workouts, w];
  saveLS('workouts', workouts);
  editSnapshot = {};
  w.exercises.forEach(ex => { editSnapshot[ex.id] = ex.name; });
  setState({ workouts, view: 'workoutEdit', editWorkoutId: w.id });
}

function duplicateWorkout(id) {
  const src = workoutById(id);
  if (!src) return;
  const copy = {
    id: newId('w'),
    name: `${src.name} copy`,
    label: src.label,
    color: src.color,
    exercises: src.exercises.map(ex => ({ ...ex, id: newId('e') })),
  };
  const srcIdx   = state.workouts.findIndex(w => w.id === id);
  const workouts = [...state.workouts];
  workouts.splice(srcIdx + 1, 0, copy);
  saveLS('workouts', workouts);
  setState({ workouts });
}

function deleteWorkout(id) {
  const w = workoutById(id);
  if (!w) return;
  if (!confirm(`Delete "${w.name}"? This cannot be undone.`)) return;
  const isActive = state.activeSession?.sessionType === id;
  if (isActive && !confirm('A session for this workout is in progress. Deleting it will also abandon that session. Continue?')) return;
  const workouts = state.workouts.filter(x => x.id !== id);
  saveLS('workouts', workouts);
  const patch = { workouts, view: 'workouts' };
  if (isActive) {
    removeLS('currentSession');
    patch.activeSession = null;
    patch.sessionType    = null;
  }
  setState(patch);
}

function moveExercise(i, dir) {
  harvestEditorDOM();
  const w = workoutById(state.editWorkoutId);
  if (!w) return;
  const j = i + dir;
  if (j < 0 || j >= w.exercises.length) return;
  [w.exercises[i], w.exercises[j]] = [w.exercises[j], w.exercises[i]];
  saveLS('workouts', state.workouts);
  setState({});
}

function addExerciseRow() {
  harvestEditorDOM();
  const w = workoutById(state.editWorkoutId);
  if (!w) return;
  w.exercises.push({ id: newId('e'), name: '', weight: 0, targetReps: '', rest: '', notes: '', targetSets: DEFAULT_TARGET_SETS });
  saveLS('workouts', state.workouts);
  setState({});
}

function removeExerciseRow(i) {
  harvestEditorDOM();
  const w = workoutById(state.editWorkoutId);
  if (!w || !w.exercises[i]) return;
  w.exercises.splice(i, 1);
  saveLS('workouts', state.workouts);
  setState({});
}

function setWorkoutColor(n) {
  harvestEditorDOM();
  const w = workoutById(state.editWorkoutId);
  if (!w) return;
  w.color = ((n % WK_PALETTE_SIZE) + WK_PALETTE_SIZE) % WK_PALETTE_SIZE;
  saveLS('workouts', state.workouts);
  setState({});
}

function saveWorkoutEdit() {
  harvestEditorDOM();
  const w = workoutById(state.editWorkoutId);
  if (!w) { setState({ view: 'workouts', editWorkoutId: null }); return; }

  w.name  = (w.name || '').trim() || 'Untitled workout';
  w.label = (w.label || '').trim().slice(0, 3) || w.name.slice(0, 3).toUpperCase();

  // Drop rows left completely blank (e.g. "+ Add exercise" then never filled in).
  w.exercises = w.exercises.filter(ex => (ex.name || '').trim());

  // 1) Duplicate exercise names WITHIN this workout would make
  //    saveExerciseToSession/completedExercises (both keyed by name) collide —
  //    auto-suffix repeats rather than silently losing one exercise's sets.
  const seenNames = new Map();
  w.exercises.forEach(ex => {
    ex.name = ex.name.trim();
    const key   = ex.name.toLowerCase();
    const count = (seenNames.get(key) || 0) + 1;
    seenNames.set(key, count);
    if (count > 1) ex.name = `${ex.name} (${count})`;
    ex.weight     = Number.isFinite(ex.weight) ? Math.max(0, ex.weight) : 0;
    ex.targetSets = clampSets(ex.targetSets);
  });

  // 2) Renaming an exercise orphans its history (getExerciseHistory/detectPRs/
  //    getProgressData all key on the name string) — offer to rewrite it.
  let history = state.history;
  let historyChanged = false;
  w.exercises.forEach(ex => {
    const oldName = editSnapshot[ex.id];
    if (oldName && oldName !== ex.name && history.some(h => h.exercise === oldName)) {
      const rewrite = confirm(
        `Rename "${oldName}" to "${ex.name}" in past history too?\n\n` +
        `OK keeps its progress graph and PRs under the new name.\n` +
        `Cancel leaves old history entries under "${oldName}".`
      );
      if (rewrite) {
        history = history.map(h => h.exercise === oldName ? { ...h, exercise: ex.name } : h);
        historyChanged = true;
      }
    }
  });

  if (historyChanged) saveLS('workoutHistory', history);
  saveLS('workouts', state.workouts);
  editSnapshot = {};
  setState({ view: 'workouts', editWorkoutId: null, ...(historyChanged ? { history } : {}) });
}

// ============================================================
// PROGRESS BAR
// ============================================================
function progressBarHTML(completed, total, title) {
  const pct = total > 0 ? (completed / total) * 100 : 0;
  return `
    <div class="progress-bar-wrap mb-4">
      <div class="progress-bar-labels mb-1">
        <span class="label" style="color:var(--cyan)">${esc(title).toUpperCase()}</span>
        <span class="label">${completed}/${total}</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
}

// ============================================================
// CALENDAR BUILDER
// ============================================================
function buildCalendarHTML() {
  const now    = new Date();
  const target = new Date(now.getFullYear(), now.getMonth() - state.calOffset, 1);
  const year   = target.getFullYear();
  const month  = target.getMonth();

  // Build a set of worked dates → history entry (for colour lookup)
  const workedDays = {};
  state.history.forEach(e => {
    const d   = new Date(e.date);
    if (d.getFullYear() === year && d.getMonth() === month) {
      const key = d.getDate();
      if (!workedDays[key]) workedDays[key] = e;
    }
  });

  const monthName  = target.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDayRaw = new Date(year, month, 1).getDay(); // 0=Sun
  const startDay    = (startDayRaw + 6) % 7; // Mon=0, Tue=1 ... Sun=6
  const todayDate   = (now.getMonth() === month && now.getFullYear() === year) ? now.getDate() : -1;

  const dayLabels  = ['Mo','Tu','We','Th','Fr','Sa','Su'].map(d =>
    `<div class="cal-day-label">${d}</div>`).join('');

  // Empty cells before day 1
  const empties = Array(startDay).fill(`<div class="cal-day empty"></div>`).join('');

  // Day cells
  const days = Array.from({ length: daysInMonth }, (_, i) => {
    const day     = i + 1;
    const entry   = workedDays[day];
    const isToday = day === todayDate;
    const cls     = ['cal-day', entry ? 'worked' : '', isToday && !entry ? 'today' : ''].filter(Boolean).join(' ');
    const style   = entry ? ` style="${wkStyle(colorForHistoryEntry(entry))}"` : '';
    return `<div class="${cls}"${style}>${day}</div>`;
  }).join('');

  const canGoForward = state.calOffset > 0;

  // Legend covers only the workouts actually trained in the month on screen.
  // Listing every workout turned into its own wall of names once there were
  // more than a handful — the same noise the home screen was just relieved of.
  const legendIds = new Set();
  const legendItems = [];
  Object.values(workedDays).forEach(e => {
    const w = workoutById(e.workoutId) || state.workouts.find(x => x.label === e.session);
    const key = w ? w.id : `~${e.session}`;
    if (legendIds.has(key)) return;
    legendIds.add(key);
    legendItems.push({ name: w ? w.name : String(e.session ?? '?'), color: colorForHistoryEntry(e) });
  });
  const LEGEND_MAX = 6;
  const legend = legendItems.slice(0, LEGEND_MAX).map(l =>
    `<span style="font-size:0.6rem;color:var(--wk${l.color})">■ ${esc(l.name)}</span>`).join('')
    + (legendItems.length > LEGEND_MAX
        ? `<span style="font-size:0.6rem;color:var(--text-dim)">+${legendItems.length - LEGEND_MAX} more</span>` : '');

  return `
    <div class="card card--glow mb-4">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
        <button type="button" class="cal-nav" aria-label="Previous month" onclick="setState({calOffset: state.calOffset + 1})">‹</button>
        <div class="label" style="color:var(--text-mid);font-weight:700">${monthName.toUpperCase()}</div>
        <button type="button" class="cal-nav" aria-label="Next month" onclick="setState({calOffset: Math.max(0, state.calOffset - 1)})" ${!canGoForward ? 'style="opacity:0.2;pointer-events:none"' : ''}>›</button>
      </div>
      <div class="cal-grid">
        ${dayLabels}
        ${empties}
        ${days}
      </div>
      ${legend ? `<div style="display:flex;gap:12px;margin-top:8px;justify-content:center;flex-wrap:wrap">${legend}</div>` : ''}
    </div>`;
}

  const tab = state.homeTab;

  const tabBar = `
    <div class="tab-bar mb-0" role="tablist" aria-label="Home tabs">

  if (tab === 'progress') {
    const dateStr = new Date().toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'short'});

      <div class="screen">

          </div>

  // ── Workout tab ──
  const stats   = getQuickStats();
  const session = state.activeSession;

  const statsHTML = stats ? `
    <div class="card card--glow mb-4">
      <div class="stats-grid">
        <div class="stat-item">
          <div style="font-size:1.375rem;font-weight:800;color:var(--cyan);letter-spacing:-0.02em">${stats.lastWorkout}</div>
          <div class="label mt-1">Last session</div>

        <div class="stat-item">
          <div style="font-size:1.375rem;font-weight:800;color:var(--cyan);letter-spacing:-0.02em">${stats.totalSessions}</div>
          <div class="label mt-1">Total sessions</div>
        </div>
        <div class="stat-item">
          <div style="font-size:1.375rem;font-weight:800;color:var(--cyan);letter-spacing:-0.02em">${stats.thisWeek}</div>
          <div class="label mt-1">This week</div>

      <div class="empty-state-icon">🏋️</div>
      <div class="empty-state-title">No sessions yet</div>
      <div class="empty-state-sub">Pick a session below to get started.<br>Your stats will appear here after your first workout.</div>
    </div>`;

  const resumeWorkout = session ? workoutById(session.sessionType) : null;
  const resumeHTML = (session?.exercises.length > 0) ? `
    <div class="resume-banner mb-4">
      <div style="font-weight:700;font-size:0.875rem;color:var(--blue);margin-bottom:2px">${esc(resumeWorkout?.name ?? 'Workout')} in progress</div>
      <div class="label mb-3">${session.exercises.length}/${resumeWorkout?.exercises.length ?? 0} exercises complete</div>
      <div class="flex-row">

        <button type="button" class="btn-abandon" onclick="abandonSession()">ABANDON</button>

  const startBtnHTML = state.workouts.length === 0 ? `
    <div class="empty-state mb-6">
      <div class="empty-state-icon">📋</div>
      <div class="empty-state-title">No workouts yet</div>
      <div class="empty-state-sub">Create a workout to start tracking sessions.</div>
      <button type="button" class="btn-primary empty-state-action" onclick="setState({view:'workoutNew'})">${icons.plus} New Workout</button>
    </div>` : `
    <div class="mb-6">
      <button type="button" class="btn-primary" onclick="setState({view:'workouts'})">${icons.chevron} START WORKOUT</button>
    </div>`;

  return `
    <div class="screen">
      <div class="container container--home">
        <div class="text-center mb-4">
          <div class="label mb-1">MATT · ${new Date().toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'short'})}</div>
          <h1 class="title-xl mb-4">Workout Tracker</h1>
          ${tabBar}
        </div>
        ${statsHTML}
        ${resumeHTML}
        ${startBtnHTML}
        ${buildCalendarHTML()}
        <div class="space-y-2">
          <button type="button" class="btn-nav" onclick="setState({view:'workoutNew'})">${icons.plus} New Workout</button>
          <button type="button" class="btn-nav" onclick="setState({view:'history'})">View History</button>
          <button type="button" class="btn-nav" onclick="setState({view:'settings'})" style="color:var(--text-dim)">⚙ Settings</button>
        </div>
      </div>
